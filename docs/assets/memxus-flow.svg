<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Memxus flow: save context from anywhere, into one context engine, recall it in any AI, you stay in control.">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #fbfdfb; }
    .card  { fill: #ffffff; stroke: #e3e8e4; }
    .core  { fill: #ffffff; stroke: #36BB9A; }
    .lane  { fill: #36BB9A; opacity: .10; }
    .txt   { fill: #1f2a24; }
    .muted { fill: #6b7a70; }
    .accent{ fill: #2f9e7f; }
    .flow  { stroke: #36BB9A; }
    .link  { stroke: #cfe8df; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0f1512; }
      .card  { fill: #16201b; stroke: #2a3a31; }
      .core  { fill: #12211b; stroke: #47CEAC; }
      .lane  { fill: #47CEAC; opacity: .12; }
      .txt   { fill: #e8f0eb; }
      .muted { fill: #8fa398; }
      .accent{ fill: #47CEAC; }
      .flow  { stroke: #47CEAC; }
      .link  { stroke: #2f4a3d; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="470" rx="18"/>

  <!-- Section labels -->
  <text class="muted" x="150" y="34" font-size="12" letter-spacing="2" text-anchor="middle">SAVE FROM ANYWHERE</text>
  <text class="accent" x="450" y="34" font-size="12" letter-spacing="2" text-anchor="middle" font-weight="700">ONE CONTEXT ENGINE</text>
  <text class="muted" x="750" y="34" font-size="12" letter-spacing="2" text-anchor="middle">RECALL ANYWHERE</text>

  <!-- Connector lines: sources -> core -->
  <g class="link" stroke-width="1.5" fill="none">
    <path d="M255 76 C 320 76, 330 210, 360 210"/>
    <path d="M255 128 C 320 128, 330 215, 360 215"/>
    <path d="M255 180 C 330 180, 335 220, 360 220"/>
    <path d="M255 232 C 330 232, 335 225, 360 225"/>
    <path d="M255 284 C 320 284, 330 235, 360 235"/>
  </g>
  <!-- Connector lines: core -> clients -->
  <g class="link" stroke-width="1.5" fill="none">
    <path d="M540 210 C 570 210, 580 76, 645 76"/>
    <path d="M540 215 C 570 215, 580 128, 645 128"/>
    <path d="M540 220 C 575 220, 580 180, 645 180"/>
    <path d="M540 225 C 575 225, 580 232, 645 232"/>
    <path d="M540 235 C 570 235, 580 284, 645 284"/>
  </g>

  <!-- SAVE column -->
  <g font-size="13">
    <g><rect class="card" x="45"  y="58"  width="210" height="36" rx="9"/><text class="txt" x="66" y="81">⌥  GitHub</text></g>
    <g><rect class="card" x="45"  y="110" width="210" height="36" rx="9"/><text class="txt" x="66" y="133">▤  Files / Documents</text></g>
    <g><rect class="card" x="45"  y="162" width="210" height="36" rx="9"/><text class="txt" x="66" y="185">▦  Notion</text></g>
    <g><rect class="card" x="45"  y="214" width="210" height="36" rx="9"/><text class="txt" x="66" y="237">◫  Slack</text></g>
    <g><rect class="card" x="45"  y="266" width="210" height="36" rx="9"/><text class="txt" x="66" y="289">◆  Your decisions</text></g>
  </g>

  <!-- CORE node -->
  <rect class="core" x="360" y="150" width="180" height="150" rx="16" stroke-width="2"/>
  <text class="txt"    x="450" y="192" font-size="20" font-weight="800" text-anchor="middle">MEMXUS</text>
  <text class="accent" x="450" y="214" font-size="12" letter-spacing="1.5" text-anchor="middle">CONTEXT ENGINE</text>
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <rect class="lane" x="378" y="238" width="48" height="22" rx="11"/><text class="accent" x="402" y="253">SAVE</text>
    <rect class="lane" x="426" y="238" width="52" height="22" rx="11"/><text class="accent" x="452" y="253">RECALL</text>
    <rect class="lane" x="478" y="238" width="48" height="22" rx="11"/><text class="accent" x="502" y="253">CTRL</text>
  </g>

  <!-- RECALL column -->
  <g font-size="13">
    <g><rect class="card" x="645" y="58"  width="210" height="36" rx="9"/><text class="txt" x="666" y="81">✳  Claude</text></g>
    <g><rect class="card" x="645" y="110" width="210" height="36" rx="9"/><text class="txt" x="666" y="133">◈  Cursor</text></g>
    <g><rect class="card" x="645" y="162" width="210" height="36" rx="9"/><text class="txt" x="666" y="185">◍  ChatGPT</text></g>
    <g><rect class="card" x="645" y="214" width="210" height="36" rx="9"/><text class="txt" x="666" y="237">✦  Gemini</text></g>
    <g><rect class="card" x="645" y="266" width="210" height="36" rx="9"/><text class="txt" x="666" y="289">‹›  VS Code</text></g>
  </g>

  <!-- YOU CONTROL footer -->
  <text class="muted" x="450" y="358" font-size="12" letter-spacing="2" text-anchor="middle">YOU CONTROL</text>
  <rect class="card" x="300" y="374" width="300" height="58" rx="12"/>
  <text class="txt"   x="450" y="400" font-size="14" font-weight="700" text-anchor="middle">Dashboard · Notebook</text>
  <text class="muted" x="450" y="420" font-size="12" text-anchor="middle">View, edit, delete anytime</text>
</svg>
